name: cografist
description: Türkiye coğrafyasını öğrenmenin en eğlenceli yolu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.3
  json_annotation: ^4.9.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/maps/
    - assets/images/
